<!doctype html>
<html lang="ru">

<title>Аддон — HL2SBPP Addons</title>
<link rel="stylesheet" href="/addon-detail.css">

<body class="site-loading">

    <div class="splash-title">HL2SBPP</div>

<header class="topbar">

  <div class="top-actions">
    <label class="searchbox"><span>⌕</span><input id="topSearch" placeholder="Поиск аддонов..."></label>

<div class="layout">

      <a class="side-link" href="/"><span>⌂</span>Главная</a>

    <div class="side-bottom">
      <div class="mini-user">
        <span id="sideAvatar" class="avatar-letter">?</span>
        <div><strong id="sideName">Гость</strong><span id="sideRole">Просмотр без входа</span></div>
      </div>
      <a class="logout" href="/">← К аддонам</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-top">
      <button class="back-btn" id="backBtn" type="button">← Назад</button>
      <div id="pageStatus" class="status">Загрузка аддона...</div>
    </div>

    <section id="addonPage" class="detail-grid" hidden></section>

<div id="toast" class="toast"></div>
<script src="/motion.js"></script><script src="/addon.js"></script>
