<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL2SBPP Workshop</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">HL2<span>SBPP</span> WORKSHOP</div>
  <nav><a href="#workshop">Workshop</a><a href="#upload">Publish</a></nav>
  <div id="account"></div>
</header>

<section id="authGate" class="gate">
  <div class="authCard">
    <div class="eyebrow">CREATE. SHARE. PLAY.</div>
    <h1 id="authTitle">Регистрация</h1>
    <p class="muted">Создай аккаунт HL2SBPP и публикуй свои аддоны.</p>
    <form id="registerForm">
      <label>Имя пользователя<input name="username" required minlength="3" maxlength="32" placeholder="Например: Freeman"></label>
      <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
      <label>Пароль<input name="password" type="password" required minlength="8" placeholder="Минимум 8 символов"></label>
      <label>Повторить пароль<input name="repeatPassword" type="password" required minlength="8" placeholder="Повтори пароль"></label>
      <button>ЗАРЕГИСТРИРОВАТЬСЯ</button>
    </form>
    <form id="loginForm" class="hidden">
      <label>Email<input name="email" type="email" required></label>
      <label>Пароль<input name="password" type="password" required></label>
      <button>ВОЙТИ</button>
    </form>
    <div id="authMsg" class="message"></div>
    <div class="switch">Уже есть аккаунт? <button type="button" class="link" id="switchAuth">Войти</button></div>
  </div>
</section>

<main id="app" class="hidden">
<section class="hero" id="workshop">
  <div class="particles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="eyebrow">HL2SBPP COMMUNITY WORKSHOP</div>
  <h1>CREATE. SHARE. PLAY.</h1>
  <p>Загружай карты, оружие, NPC, модели и другие аддоны для HL2SBPP.</p>
</section>

<section class="toolbar">
  <input id="search" placeholder="Поиск аддонов...">
  <select id="category"><option>All</option><option>Maps</option><option>Weapons</option><option>NPCs</option><option>Vehicles</option><option>Models</option><option>Other</option></select>
  <button id="refresh">Обновить</button>
</section>

<section class="content">
  <div>
    <div class="sectionTitle"><h2>Последние аддоны</h2><span id="count"></span></div>
    <div id="addons" class="grid"></div>
  </div>
  <aside id="upload">
    <h2>Опубликовать</h2>
    <form id="uploadForm">
      <input name="title" required maxlength="100" placeholder="Название">
      <select name="category"><option>Maps</option><option>Weapons</option><option>NPCs</option><option>Vehicles</option><option>Models</option><option>Other</option></select>
      <input name="version" value="1.0.0" placeholder="Версия">
      <textarea name="description" maxlength="5000" placeholder="Описание"></textarea>
      <input name="package" type="file" accept=".zip" required>
      <button>ЗАГРУЗИТЬ ZIP</button>
    </form>
    <div id="uploadMsg" class="message"></div>
  </aside>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
