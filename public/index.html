<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL2SBPP Addons</title><link rel="stylesheet" href="/style.css"></head>
<body class="site-loading">
<div id="siteSplash" class="site-splash" aria-hidden="true">
  <div class="splash-blur"></div>
  <div class="splash-card">
    <div class="splash-orbit"><span class="orbit-item">NPC</span><span class="orbit-item">PLAYER</span><span class="orbit-item">SWEP</span><span class="orbit-item">PROP</span></div>
    <div class="splash-logo"><span>H</span></div>
    <div class="splash-title">HL2SBPP</div>
    <div class="splash-sub">ADDONS</div>
    <div class="splash-line"><i></i></div>
  </div>
</div>
<header class="main-header">
  <a class="brand brand-premium" href="/">
    <span class="brand-mark">HL</span><span>HL2SBPP</span><em>Addons</em>
  </a>
  <div class="header-center"><span class="header-pulse"></span><span>HL2SBPP NETWORK</span><i></i><span>LIVE</span></div>
  <div class="actions">
    <button class="btn ghost-btn" id="createBtn">＋ Добавить аддон</button>
    <button class="profile-chip player-chip" id="profileBtn" aria-label="Профиль игрока">
      <span class="player-avatar"><img id="userAvatar" src="/avatar-placeholder.svg" alt="Иконка игрока"></span>
      <span class="player-info"><small>ИГРОК</small><b id="userName">Гость</b></span>
      <span class="player-status" id="playerStatus">OFFLINE</span>
    </button>
  </div>
</header>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="ambient ambient-three"></div><div class="scanline"></div><div class="hud-corner hud-a"></div><div class="hud-corner hud-b"></div>
<main>
  <section class="hero"><div><small>HL2SBPP ADDONS</small><h1>Найди следующий аддон.</h1><p>Популярное, новое и всё необходимое — в одном месте.</p></div><div class="search-wrap"><span>⌕</span><input id="search" placeholder="Поиск аддонов, NPC, SWEP, карт..."></div></section>
  <div class="browse-layout">
    <aside class="tag-sidebar"><div class="side-kicker">БЫСТРЫЕ ТЕГИ</div><h3>Категории</h3><div id="tags"></div></aside>
    <section class="catalog"><div class="catalog-head"><div><small>DISCOVER</small><h2>Популярное</h2></div><div class="period-tabs" id="periods"><button class="active" data-period="week">Неделя</button><button data-period="year">Год</button><button data-period="all">Всегда</button></div></div><div id="status"></div><section id="grid" class="grid"></section></section>
  </div>
</main><nav class="mobile-bar"><button id="mobileCreate">＋<span>Создать</span></button><a href="/">⌂<span>Каталог</span></a><a href="/auth/start?next=/">◉<span>Профиль</span></a></nav>
<script src="/motion.js"></script><script src="/app.js"></script></body></html>
