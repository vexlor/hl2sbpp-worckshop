services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
